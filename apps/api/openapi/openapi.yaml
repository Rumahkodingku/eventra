openapi: 3.1.0
info:
  title: Eventra API
  version: 1.0.0
  description: Contract-first API for the Eventra fullstack migration.
servers:
  - url: /api/v1
    description: Same-site API proxy
security: []
tags:
  - name: Health
  - name: Auth
  - name: Catalog
  - name: Cart
  - name: Checkout
  - name: Orders
  - name: Tickets
  - name: Organizer
  - name: Account
components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: eventra_at
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
        field_errors:
          type: object
          additionalProperties:
            type: string
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/Error"
    Pagination:
      type: object
      required: [next_cursor]
      properties:
        next_cursor:
          type: string
    Category:
      type: object
      required: [id, slug, name]
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        image:
          type: string
        icon:
          type: string
        subcategories:
          type: array
          items:
            type: string
    Venue:
      type: object
      required: [id, name, city, timezone]
      properties:
        id:
          type: string
        name:
          type: string
        address:
          type: string
        city:
          type: string
        region:
          type: string
        country:
          type: string
        timezone:
          type: string
        map_url:
          type: string
    Organizer:
      type: object
      required: [id, display_name]
      properties:
        id:
          type: string
        display_name:
          type: string
        description:
          type: string
        logo:
          type: string
        email:
          type: string
        social_links:
          type: array
          items:
            type: object
            required: [label, href]
            properties:
              label:
                type: string
              href:
                type: string
    TicketType:
      type: object
      required: [id, event_id, name, price, currency, quota, sold_count, kind, status]
      properties:
        id:
          type: string
        event_id:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          type: integer
          format: int64
        currency:
          type: string
          enum: [IDR]
        quota:
          type: integer
        sold_count:
          type: integer
        min_per_order:
          type: integer
        max_per_order:
          type: integer
        sales_start_at:
          type: string
          format: date-time
        sales_end_at:
          type: string
          format: date-time
        benefits:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE, SOLD_OUT]
        kind:
          type: string
          enum: [GENERAL_ADMISSION, SEATED]
        tier_key:
          type: string
    Seat:
      type: object
      required: [id, section_id, row, number, status]
      properties:
        id:
          type: string
        section_id:
          type: string
        row:
          type: string
        number:
          type: integer
        status:
          type: string
          enum: [AVAILABLE, SOLD, BLOCKED]
        accessible:
          type: boolean
    Section:
      type: object
      required: [id, name, tier_key, seats]
      properties:
        id:
          type: string
        name:
          type: string
        label:
          type: string
        tier_key:
          type: string
        seats:
          type: array
          items:
            $ref: "#/components/schemas/Seat"
    VenueLayout:
      type: object
      required: [id, name, sections]
      properties:
        id:
          type: string
        name:
          type: string
        sections:
          type: array
          items:
            $ref: "#/components/schemas/Section"
    EventSummary:
      type: object
      required: [id, slug, title, status, ticketing_mode, start_at, timezone, venue_id, ticket_types]
      properties:
        id:
          type: string
        slug:
          type: string
        title:
          type: string
        subcategory:
          type: string
        description:
          type: string
        cover_image:
          type: string
        status:
          type: string
          enum: [DRAFT, PUBLISHED, PAUSED, ENDED, CANCELLED]
        ticketing_mode:
          type: string
          enum: [GENERAL_ADMISSION, RESERVED_SEATING, HYBRID]
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        timezone:
          type: string
        venue_id:
          type: string
        category_id:
          type: string
        organizer_id:
          type: string
        popularity:
          type: integer
        is_featured:
          type: boolean
        is_trending:
          type: boolean
        is_recommended:
          type: boolean
        limited_availability:
          type: boolean
        is_early_bird:
          type: boolean
        ticket_types:
          type: array
          items:
            $ref: "#/components/schemas/TicketType"
    EventDetail:
      allOf:
        - $ref: "#/components/schemas/EventSummary"
        - type: object
          properties:
            gallery:
              type: array
              items:
                type: string
            tags:
              type: array
              items:
                type: string
            highlights:
              type: array
              items:
                type: string
            schedule:
              type: array
              items:
                type: object
                properties:
                  time:
                    type: string
                  title:
                    type: string
                  description:
                    type: string
            terms:
              type: array
              items:
                type: string
            age_note:
              type: string
            accessibility_note:
              type: string
            layout_id:
              type: string
            seat_layout:
              $ref: "#/components/schemas/VenueLayout"
    EventList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EventSummary"
        next_cursor:
          type: string
    TicketTypeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TicketType"
        remaining:
          type: object
          additionalProperties:
            type: integer
    User:
      type: object
      required: [id, name, email, role, locale]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [CUSTOMER, ORGANIZER]
        locale:
          type: string
          enum: [id, en]
        created_at:
          type: string
          format: date-time
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"
    CartItem:
      type: object
      required: [id, owner_key, event_id, ticket_type_id, quantity, seat_ids, unit_price_snapshot]
      properties:
        id:
          type: string
        owner_key:
          type: string
        event_id:
          type: string
        ticket_type_id:
          type: string
        quantity:
          type: integer
          minimum: 1
        seat_ids:
          type: array
          items:
            type: string
        unit_price_snapshot:
          type: integer
          format: int64
        added_at:
          type: string
          format: date-time
    Cart:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        promo_code:
          type: string
    AddCartItemRequest:
      type: object
      required: [event_id, ticket_type_id, quantity, seat_ids]
      properties:
        event_id:
          type: string
        ticket_type_id:
          type: string
        quantity:
          type: integer
          minimum: 1
        seat_ids:
          type: array
          items:
            type: string
    UpdateCartItemRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1
    PromoRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
    QuoteRequest:
      type: object
      required: [event_id, items]
      properties:
        event_id:
          type: string
        items:
          type: array
          items:
            type: object
            required: [ticket_type_id, quantity, seat_ids]
            properties:
              ticket_type_id:
                type: string
              quantity:
                type: integer
                minimum: 1
              seat_ids:
                type: array
                items:
                  type: string
        promo_code:
          type: string
    QuoteResponse:
      type: object
      required: [subtotal, service_fee, discount, total, currency]
      properties:
        subtotal:
          type: integer
          format: int64
        service_fee:
          type: integer
          format: int64
        discount:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
        currency:
          type: string
          enum: [IDR]
        promo_code:
          type: string
        expires_at:
          type: string
          format: date-time
    ReservationRequest:
      allOf:
        - $ref: "#/components/schemas/QuoteRequest"
        - type: object
          required: [event_id]
          properties:
            event_id:
              type: string
            reservation_id:
              type: string
    ReservationResponse:
      type: object
      required: [id, status, expires_at]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [ACTIVE, CONFIRMED, EXPIRED, RELEASED]
        expires_at:
          type: string
          format: date-time
    Buyer:
      type: object
      required: [name, email, phone]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
    AttendeeInput:
      type: object
      required: [full_name, email]
      properties:
        full_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
    CreateOrderRequest:
      type: object
      required: [buyer, payment_method, items, attendees, simulate_failure]
      properties:
        buyer:
          $ref: "#/components/schemas/Buyer"
        payment_method:
          type: string
        items:
          type: array
          items:
            type: object
            required: [ticket_type_id, quantity, seat_ids]
            properties:
              ticket_type_id:
                type: string
              quantity:
                type: integer
                minimum: 1
              seat_ids:
                type: array
                items:
                  type: string
        attendees:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/AttendeeInput"
        simulate_failure:
          type: boolean
    OrderItem:
      type: object
      required: [id, event_id, ticket_type_id, ticket_name_snapshot, event_title_snapshot, quantity, seat_ids, unit_price_snapshot, line_subtotal]
      properties:
        id:
          type: string
        event_id:
          type: string
        ticket_type_id:
          type: string
        ticket_name_snapshot:
          type: string
        event_title_snapshot:
          type: string
        event_start_at_snapshot:
          type: string
          format: date-time
        venue_name_snapshot:
          type: string
        quantity:
          type: integer
        seat_ids:
          type: array
          items:
            type: string
        unit_price_snapshot:
          type: integer
          format: int64
        line_subtotal:
          type: integer
          format: int64
        attendee_ids:
          type: array
          items:
            type: string
    Order:
      type: object
      required: [id, order_number, owner_key, buyer, items, subtotal, service_fee, discount, total, currency, payment_status, order_status, created_at]
      properties:
        id:
          type: string
        order_number:
          type: string
        owner_key:
          type: string
        buyer:
          $ref: "#/components/schemas/Buyer"
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        subtotal:
          type: integer
          format: int64
        service_fee:
          type: integer
          format: int64
        discount:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
        currency:
          type: string
          enum: [IDR]
        promo_code:
          type: string
        payment_method:
          type: string
        payment_status:
          type: string
          enum: [UNPAID, PROCESSING, PAID, FAILED, CANCELLED]
        order_status:
          type: string
          enum: [PENDING_PAYMENT, CONFIRMED, PAYMENT_FAILED, CANCELLED]
        created_at:
          type: string
          format: date-time
        paid_at:
          type: string
          format: date-time
    OrderList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        next_cursor:
          type: string
    OrderResult:
      type: object
      required: [order]
      properties:
        order:
          $ref: "#/components/schemas/Order"
        tickets:
          type: array
          items:
            $ref: "#/components/schemas/Ticket"
    Attendee:
      type: object
      required: [id, order_id, ticket_id, full_name, email, check_in_status]
      properties:
        id:
          type: string
        order_id:
          type: string
        ticket_id:
          type: string
        full_name:
          type: string
        email:
          type: string
        phone:
          type: string
        check_in_status:
          type: string
          enum: [NOT_CHECKED_IN, CHECKED_IN]
        checked_in_at:
          type: string
          format: date-time
    Ticket:
      type: object
      required: [id, ticket_code, order_id, event_id, ticket_type_id, attendee_id, status, issued_at]
      properties:
        id:
          type: string
        ticket_code:
          type: string
        order_id:
          type: string
        event_id:
          type: string
        ticket_type_id:
          type: string
        attendee_id:
          type: string
        seat_id:
          type: string
        status:
          type: string
          enum: [VALID, USED, CANCELLED, EXPIRED]
        issued_at:
          type: string
          format: date-time
        checked_in_at:
          type: string
          format: date-time
        qr_token:
          type: string
    TicketList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Ticket"
        next_cursor:
          type: string
    Notification:
      type: object
      required: [id, type, title, message, created_at]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [ORDER, TICKET, EVENT, SYSTEM]
        title:
          type: string
        message:
          type: string
        read_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        target_url:
          type: string
    Review:
      type: object
      required: [id, event_id, author_name, rating, comment, created_at]
      properties:
        id:
          type: string
        event_id:
          type: string
        author_name:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
        created_at:
          type: string
          format: date-time
    ReviewCreate:
      type: object
      required: [rating, comment]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
    OrganizerEventSummary:
      type: object
      required: [id, title, slug, status, start_at, timezone, ticket_types]
      properties:
        id:
          type: string
        title:
          type: string
        slug:
          type: string
        status:
          type: string
          enum: [DRAFT, PUBLISHED, PAUSED, ENDED, CANCELLED]
        start_at:
          type: string
          format: date-time
        timezone:
          type: string
        ticket_types:
          type: array
          items:
            $ref: "#/components/schemas/TicketType"
    OrganizerEventCreate:
      type: object
      required: [title, category_id, venue_id, start_at, end_at, timezone, ticketing_mode, description, cover_image, status, base_price]
      properties:
        title:
          type: string
        category_id:
          type: string
        venue_id:
          type: string
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        timezone:
          type: string
        ticketing_mode:
          type: string
          enum: [GENERAL_ADMISSION, RESERVED_SEATING, HYBRID]
        description:
          type: string
        cover_image:
          type: string
        status:
          type: string
          enum: [DRAFT, PUBLISHED]
        base_price:
          type: integer
          format: int64
        subcategory:
          type: string
        highlights:
          type: array
          items:
            type: string
        terms:
          type: array
          items:
            type: string
        age_note:
          type: string
        accessibility_note:
          type: string
    OrganizerEventUpdate:
      allOf:
        - $ref: "#/components/schemas/OrganizerEventCreate"
        - type: object
          properties:
            status:
              type: string
              enum: [DRAFT, PUBLISHED, PAUSED, ENDED, CANCELLED]
    CheckInRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
    CheckInResponse:
      type: object
      required: [ok, ticket_id, status]
      properties:
        ok:
          type: boolean
        ticket_id:
          type: string
        status:
          type: string
          enum: [VALID, USED]
        checked_in_at:
          type: string
          format: date-time
    ProfileUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
paths:
  /health/live:
    get:
      summary: HealthLive
      tags: [Health]
      operationId: healthLive
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
  /health/ready:
    get:
      summary: HealthReady
      tags: [Health]
      operationId: healthReady
      responses:
        "200":
          description: Dependencies are ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
        "503":
          description: One or more dependencies are unavailable
  /auth/login:
    post:
      summary: Login
      tags: [Auth]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/register:
    post:
      summary: Register
      tags: [Auth]
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/refresh:
    post:
      summary: Refresh
      tags: [Auth]
      operationId: refresh
      responses:
        "200":
          description: Rotated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid refresh session
  /auth/guest:
    post:
      summary: Create or resume guest principal
      tags: [Auth]
      operationId: createGuest
      responses:
        "200":
          description: Guest principal is ready
          content:
            application/json:
              schema:
                type: object
                required: [guest]
                properties:
                  guest:
                    type: boolean
  /auth/logout:
    post:
      summary: Logout
      tags: [Auth]
      operationId: logout
      security:
        - accessCookie: []
      responses:
        "204":
          description: Logged out
  /auth/logout-all:
    post:
      summary: LogoutAll
      tags: [Auth]
      operationId: logoutAll
      security:
        - accessCookie: []
      responses:
        "204":
          description: All sessions revoked
  /auth/me:
    get:
      summary: Me
      tags: [Auth]
      operationId: me
      security:
        - accessCookie: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Not authenticated
  /categories:
    get:
      summary: ListCategories
      tags: [Catalog]
      operationId: listCategories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
  /events:
    get:
      summary: ListEvents
      tags: [Catalog]
      operationId: listEvents
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: city
          in: query
          schema:
            type: string
        - name: date
          in: query
          schema:
            type: string
            enum: [week, month, next]
        - name: price
          in: query
          schema:
            type: string
            enum: [under200, 200to500, 500to1000, above1000]
        - name: mode
          in: query
          schema:
            type: string
            enum: [GENERAL_ADMISSION, RESERVED_SEATING, HYBRID]
        - name: availability
          in: query
          schema:
            type: string
            enum: [available]
        - name: sort
          in: query
          schema:
            type: string
            enum: [recommended, soonest, newest, price-low, price-high, popularity]
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Event list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
  /events/{slug}:
    get:
      summary: GetEventBySlug
      tags: [Catalog]
      operationId: getEventBySlug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Event detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
        "404":
          description: Event not found
  /events/{eventId}/ticket-types:
    get:
      summary: ListTicketTypes
      tags: [Catalog]
