services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: eventra
      MYSQL_USER: eventra
      MYSQL_PASSWORD: eventra
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - eventra-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ueventra -peventra --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - eventra-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      APP_ENV: development
      HTTP_ADDR: ":8080"
      WEB_ORIGIN: http://localhost:3000
      DATABASE_URL: eventra:eventra@tcp(mysql:3306)/eventra?parseTime=true&charset=utf8mb4&loc=UTC
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: info
      MIGRATIONS_DIR: /migrations
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    entrypoint: ["/usr/local/bin/migrate"]
    command: ["up"]
    environment:
      APP_ENV: development
      DATABASE_URL: eventra:eventra@tcp(mysql:3306)/eventra?parseTime=true&charset=utf8mb4&loc=UTC
      REDIS_URL: redis://redis:6379/0
      MIGRATIONS_DIR: /migrations
    depends_on:
      mysql:
        condition: service_healthy
    profiles: ["tools"]

volumes:
  eventra-mysql:
  eventra-redis:
