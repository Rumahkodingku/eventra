services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: eventra
      MYSQL_USER: eventra
      MYSQL_PASSWORD: eventra
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - eventra-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ueventra -peventra --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - eventra-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - eventra-minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb -p local/eventra || true;
      mc anonymous set download local/eventra || true;
      "

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      APP_ENV: development
      HTTP_ADDR: ":8080"
      WEB_ORIGIN: http://localhost:3000
      DATABASE_URL: eventra:eventra@tcp(mysql:3306)/eventra?parseTime=true&charset=utf8mb4&loc=UTC
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: info
      MIGRATIONS_DIR: /migrations
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: eventra
      S3_USE_SSL: "false"
      S3_PUBLIC_BASE: http://localhost:9000/eventra
      MOCK_PAYMENT_SECRET: mock-payment-secret
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    entrypoint: ["/usr/local/bin/worker"]
    environment:
      APP_ENV: development
      DATABASE_URL: eventra:eventra@tcp(mysql:3306)/eventra?parseTime=true&charset=utf8mb4&loc=UTC
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: info
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  migrate:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    entrypoint: ["/usr/local/bin/migrate"]
    command: ["up"]
    environment:
      APP_ENV: development
      DATABASE_URL: eventra:eventra@tcp(mysql:3306)/eventra?parseTime=true&charset=utf8mb4&loc=UTC
      REDIS_URL: redis://redis:6379/0
      MIGRATIONS_DIR: /migrations
    depends_on:
      mysql:
        condition: service_healthy
    profiles: ["tools"]

volumes:
  eventra-mysql:
  eventra-redis:
  eventra-minio:
